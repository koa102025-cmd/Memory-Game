<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Coiny&display=swap"
			rel="stylesheet" />
		<link rel="stylesheet" href="style.css" />
		<script src="./javascript.js" defer></script>
		<title>Memory Game</title>
	</head>
	<body>
		<div></div>
		<header>
			<div class="logo-div">
				<img src="./assets/logo-puzzle.png" class="logo-img" />
				<p class="game-name">Memory Game</p>
			</div>
			<button id="new-game" class="button">
				<svg
					class="icon"
					xmlns="http://www.w3.org/2000/svg"
					viewBox="0 0 24 24"
					fill="none"
					stroke="currentColor"
					stroke-width="2"
					stroke-linecap="round"
					stroke-linejoin="round">
					<line x1="12" y1="5" x2="12" y2="19" />
					<line x1="5" y1="12" x2="19" y2="12" /></svg
				>New Game
			</button>
		</header>
		<main>
			<section id="section-match">
				<p class="memory-match">Memory Match</p>
				<div class="match-results">
					<div class="divs-match">
						<p>Moves</p>
						<p id="moves">0</p>
					</div>
					<div class="divs-match">
						<p>Time</p>
						<p id="time">0:00</p>
					</div>
					<div class="divs-match">
						<p>Matches</p>
						<p id="matches">0/5</p>
					</div>
				</div>
			</section>

			<section id="board">
				<!-- <div class="card" id="card1">
					<div class="card-inner">
						<div class="card-front">
							<div class="icon-hover"></div>
						</div>
						<div class="card-back icon-hover"></div>
					</div>
				</div>-->
			</section>

			<section id="win-section" class="win-section">
				<div class="win-content">
					<p class="you-win">You Win!</p>
					<p id="win-moves">Moves:</p>
					<p id="win-time">Time:</p>
					<button class="button play-again" id="play-again">Play Again</button>
				</div>
			</section>
		</main>
		<footer><p>© Oleksandra / 2025</p></footer>
	</body>
</html>
